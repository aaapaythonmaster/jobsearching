services:
  - type: web
    name: jobsearching-api-aaapaythonmaster
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: zhipu
      - key: AI_MODEL
        value: glm-5.2
      - key: AI_OCR_MODEL
        value: glm-ocr
      - key: AI_BASE_URL
        value: https://api.z.ai/api/paas/v4
      - key: AI_API_KEY
        sync: false
