databases:
  - name: jobsearching-db
    plan: free
    databaseName: jobsearching
    user: jobsearching

services:
  - type: web
    name: jobsearching-api-aaapaythonmaster
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: jobsearching-db
          property: connectionString
      - key: AI_PROVIDER
        value: zhipu
      - key: AI_MODEL
        value: glm-5.2
      - key: AI_OCR_MODEL
        value: glm-ocr
      - key: AI_BASE_URL
        value: https://api.z.ai/api/paas/v4
      - key: AI_API_KEY
        sync: false

  - type: web
    name: jobsearching-web-aaapaythonmaster
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://jobsearching-api-aaapaythonmaster.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
